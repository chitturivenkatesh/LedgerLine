spring:
  application:
    name: ledgerline
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ledgerline_project_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none       # schema is owned by database/schema.sql (Hibernate validate mis-reads MySQL ENUM columns)
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
server:
  port: 8080
app:
  jwt:
    secret: ${JWT_SECRET}          # Base64, at least 32 bytes. No default on purpose.
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:false}
    password: ${SEED_PASSWORD:}
    app:
      jwt:
        secret=${JWT_SECRET}:
